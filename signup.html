<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account – BreakChain AI</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--bg-gradient);
    }
    .auth-card {
      background: white;
      padding: 40px 32px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      text-align: center;
      width: 90%;
      max-width: 380px;
      border: 1px solid #f3e5f5;
    }
    .auth-card h2 {
      color: #3b1145;
      margin-bottom: 8px;
      font-weight: 800;
    }
    .auth-card p {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 15px;
      border: 1.5px solid #e1bee7;
      border-radius: var(--radius-sm);
      outline: none;
      font-family: inherit;
    }
    input:focus {
      border-color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div style="font-size: 40px; margin-bottom: 12px;">🌱</div>
    <h2>Create Your Healing Space</h2>
    <p>Take the first step toward self-recovery</p>
    
    <input type="text" id="username" placeholder="Choose a display name / nickname" autofocus />
    <button class="bc-btn" style="width: 100%;" onclick="signup()">Create Account →</button>
    <div style="margin-top: 18px; font-size: 13.5px;">
      <a href="login.html" style="color: #8e24aa; text-decoration: none; font-weight: 600;">Already have an account? Login</a>
    </div>
  </div>

  <script>
    function signup() {
      const name = document.getElementById("username").value.trim();
      if (!name) return alert("Please enter a name.");
      localStorage.setItem("breakchain_user", name);
      window.location.href = "index.html";
    }

    document.getElementById("username").addEventListener("keypress", (e) => {
      if (e.key === "Enter") signup();
    });
  </script>
</body>
</html>
