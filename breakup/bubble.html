<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relaxing Bubble Popper – BreakChain AI</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body {
      overflow: hidden;
      user-select: none;
    }

    .game-hud {
      position: fixed;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 12px 24px;
      border-radius: 30px;
      box-shadow: var(--shadow-md);
      display: flex;
      gap: 20px;
      align-items: center;
      z-index: 100;
      border: 1px solid #f8bbd0;
    }

    .bubble {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      position: absolute;
      animation: floatUp 8s linear forwards;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: inset -5px -5px 15px rgba(255,255,255,0.6), 0 8px 20px rgba(0,0,0,0.1);
      transition: transform 0.15s;
    }

    .bubble:hover {
      transform: scale(1.15);
    }

    @keyframes floatUp {
      0% {
        bottom: -90px;
        left: calc(10% + 80% * var(--rand-x));
        opacity: 0.9;
      }
      100% {
        bottom: 105vh;
        left: calc(10% + 80% * var(--rand-x));
        opacity: 0.4;
      }
    }
  </style>
</head>
<body>

  <header class="bc-header">
    <h1>💔 BreakChain AI</h1>
  </header>

  <nav class="bc-nav">
    <div class="bc-nav-links">
      <a href="index.html">🏠 Home</a>
      <a href="games.html">🎮 Games Hub</a>
      <a href="bubble.html" class="active">🫧 Bubble Popper</a>
      <a href="smash.html">💥 Smash Plate</a>
      <a href="scribber.html">🎨 Scribbler</a>
      <a href="breathe.html">🌬️ Breathe</a>
    </div>
    <div class="bc-nav-user">
      <a href="games.html" class="bc-btn-sm">← Back to Games</a>
    </div>
  </nav>

  <div class="game-hud">
    <div style="font-weight: 700; color: #8e24aa;">🫧 Bubbles Popped: <span id="score">0</span></div>
    <div id="mantra" style="font-size: 13.5px; color: #555; font-style: italic;">Tap floating bubbles to pop your anxiety away 🌸</div>
  </div>

  <script src="soulbot-widget.js"></script>
  <script>
    let score = 0;
    const colors = [
      "linear-gradient(135deg, rgba(244, 143, 177, 0.75), rgba(233, 30, 99, 0.5))",
      "linear-gradient(135deg, rgba(128, 222, 234, 0.75), rgba(0, 188, 212, 0.5))",
      "linear-gradient(135deg, rgba(206, 147, 216, 0.75), rgba(156, 39, 176, 0.5))",
      "linear-gradient(135deg, rgba(255, 204, 128, 0.75), rgba(255, 152, 0, 0.5))",
      "linear-gradient(135deg, rgba(165, 214, 167, 0.75), rgba(76, 175, 80, 0.5))"
    ];

    const emojis = ["🌸", "✨", "💜", "🕊️", "💖", "🌿", "🦋", "🫧"];
    const mantras = [
      "Breathe and let it go 🌿",
      "You are stronger than this moment 💪",
      "Peace begins within you ✨",
      "Every pop dissolves the stress 🎈",
      "You are worthy of genuine love ❤️",
      "Healing takes time, be gentle 🌸"
    ];

    // Web Audio Synthesized Pop
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playPopSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(450 + Math.random() * 200, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    function createBubble() {
      const b = document.createElement('div');
      b.className = 'bubble';
      b.style.background = colors[Math.floor(Math.random() * colors.length)];
      b.style.setProperty('--rand-x', Math.random());
      b.style.animationDuration = `${6 + Math.random() * 4}s`;
      b.innerText = emojis[Math.floor(Math.random() * emojis.length)];

      b.onclick = () => {
        playPopSound();
        score++;
        document.getElementById('score').innerText = score;
        document.getElementById('mantra').innerText = mantras[Math.floor(Math.random() * mantras.length)];
        b.remove();
      };

      document.body.appendChild(b);
      setTimeout(() => {
        if (document.body.contains(b)) b.remove();
      }, 10000);
    }

    setInterval(createBubble, 1200);
    for (let i = 0; i < 6; i++) createBubble();
  </script>
</body>
</html>
