<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mood Scribbler – BreakChain AI</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    .scribble-container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
      text-align: center;
    }

    .canvas-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-md);
      border: 1px solid #f3e5f5;
      display: inline-block;
    }

    .tools-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    #drawingCanvas {
      background: #ffffff;
      border: 2px dashed #ce93d8;
      border-radius: var(--radius-md);
      cursor: crosshair;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.02);
      touch-action: none;
    }

    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      cursor: pointer;
      display: inline-block;
      transition: transform 0.15s;
    }

    .color-swatch:hover, .color-swatch.selected {
      transform: scale(1.25);
    }
  </style>
</head>
<body>

  <header class="bc-header">
    <h1>💔 BreakChain AI</h1>
  </header>

  <nav class="bc-nav">
    <div class="bc-nav-links">
      <a href="index.html">🏠 Home</a>
      <a href="games.html">🎮 Games Hub</a>
      <a href="bubble.html">🫧 Bubble Popper</a>
      <a href="smash.html">💥 Smash Plate</a>
      <a href="scribber.html" class="active">🎨 Scribbler</a>
      <a href="breathe.html">🌬️ Breathe</a>
    </div>
    <div class="bc-nav-user">
      <a href="games.html" class="bc-btn-sm">← Back to Games</a>
    </div>
  </nav>

  <div class="scribble-container">
    <h1 style="font-size: 36px; color: #3b1145; font-weight: 800;">🎨 Mood Scribbler & Expressive Art Therapy</h1>
    <p style="color: #666; font-size: 16px; margin-bottom: 20px;">Doodle, scribble, or sketch out the messy emotions words can't capture.</p>

    <div class="canvas-card">
      <div class="tools-bar">
        <div style="display: flex; gap: 8px; align-items: center;">
          <span class="color-swatch selected" style="background:#9c27b0;" onclick="setColor('#9c27b0', this)"></span>
          <span class="color-swatch" style="background:#e91e63;" onclick="setColor('#e91e63', this)"></span>
          <span class="color-swatch" style="background:#2196f3;" onclick="setColor('#2196f3', this)"></span>
          <span class="color-swatch" style="background:#4caf50;" onclick="setColor('#4caf50', this)"></span>
          <span class="color-swatch" style="background:#ff9800;" onclick="setColor('#ff9800', this)"></span>
          <span class="color-swatch" style="background:#2d3748;" onclick="setColor('#2d3748', this)"></span>
        </div>

        <input type="color" id="customColor" value="#9c27b0" onchange="setColor(this.value, null)" style="width:36px; height:36px; border:none; cursor:pointer;" />

        <div style="display: flex; align-items: center; gap: 6px; margin-left: 10px;">
          <label style="font-size: 13px; font-weight: 700; color: #555;">Size:</label>
          <input type="range" id="brushSize" min="1" max="25" value="4" style="width: 80px;" />
        </div>

        <button class="bc-btn-sm" style="background:#e53e3e;" onclick="clearCanvas()">🧹 Clear Board</button>
        <button class="bc-btn-sm" onclick="downloadDrawing()">📥 Save Artwork</button>
      </div>

      <canvas id="drawingCanvas" width="650" height="450"></canvas>
    </div>
  </div>

  <footer class="bc-footer">
    <p>© 2025–2026 BreakChain AI. Art heals the unspoken hurt.</p>
  </footer>

  <script src="soulbot-widget.js"></script>
  <script>
    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    const sizeInput = document.getElementById('brushSize');

    let isDrawing = false;
    let currentColor = "#9c27b0";

    function setColor(color, el) {
      currentColor = color;
      if (el) {
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
        el.classList.add('selected');
      }
    }

    function startDraw(e) {
      isDrawing = true;
      ctx.beginPath();
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
      const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
      ctx.moveTo(x, y);
    }

    function draw(e) {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
      const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;

      ctx.lineWidth = sizeInput.value;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = currentColor;
      ctx.lineTo(x, y);
      ctx.stroke();
    }

    function stopDraw() {
      isDrawing = false;
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('mouseleave', stopDraw);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
    canvas.addEventListener('touchend', stopDraw);

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function downloadDrawing() {
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = `BreakChain-Art-${Date.now()}.png`;
      a.click();
    }
  </script>
</body>
</html>
